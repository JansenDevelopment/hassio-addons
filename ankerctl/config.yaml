name: ankerctl (AnkerMake M5)
description: Monitor and control an AnkerMake M5 3D printer without Anker's apps, with Home Assistant MQTT discovery
version: 1.0.3-10
slug: "ankerctl"
url: https://github.com/JansenDevelopment/hassio-addons
init: false
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
# PPPP (file upload, camera) is UDP peer-to-peer with the printer; NAT breaks it.
host_network: true
ports:
  4470/tcp: 4470
ports_description:
  4470/tcp: Web interface and OctoPrint-compatible upload API
webui: "http://[HOST]:[PORT:4470]/"
services:
  - mqtt:want
hassio_api: true
options:
  port: 4470
  ha_mqtt: true
  timelapse: false
  upload_rate_mbps: 10
schema:
  port: port
  ha_mqtt: bool
  timelapse: bool
  upload_rate_mbps: list(5|10|25|50|100)
  api_key: match(^[A-Za-z0-9_-]{16,}$)?
  debug: bool?
  cors_origins: str?
  printer_ip: match(^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$)?
