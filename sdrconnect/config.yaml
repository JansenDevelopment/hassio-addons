name: SDRconnect server (SDRplay)
description: Runs SDRplay's SDRconnect as a network server for an RSP on USB; use it from SDRconnect on another computer
version: 1.0.10-2
slug: "sdrconnect"
url: https://github.com/JansenDevelopment/hassio-addons
init: false
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
# The server listens on TCP `port` (SDRconnect's default 50000) on all interfaces;
# on the host network no port mapping is needed.
host_network: true
# The RSP is a plain USB device (vendor 1df7); the app talks to it with libusb.
usb: true
udev: true
options:
  accept_licence: false
  port: 50000
schema:
  accept_licence: bool
  port: port
  extra_args: str?
